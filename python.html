<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 25 ta dars | Muslimbek</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #6c5ce7; font-weight: bold; border: 2px solid #6c5ce7; padding: 8px 20px; border-radius: 12px; }
        
        /* Video Player */
        .video-box { background: #000; width: 100%; aspect-ratio: 16/9; border-radius: 15px; margin-bottom: 30px; display: none; }
        .video-box iframe { width: 100%; height: 100%; border-radius: 15px; border: none; }

        .lesson-list { display: grid; gap: 10px; }
        .lesson-item { background: #f9f9ff; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #eee; transition: 0.3s; }
        .lesson-item:hover { background: #6c5ce7; color: white; }
        .lesson-number { font-weight: bold; margin-right: 10px; }
        .play-icon { font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-back">← Bosh sahifaga qaytish</a>
    <h1>Python: 0 dan 25-mavzugacha</h1>

    <!-- Video Player (Dars tanlanganda ko'rinadi) -->
    <div id="videoPlayer" class="video-box">
        <iframe id="youtubeFrame" src="" allowfullscreen></iframe>
    </div>

    <div class="lesson-list">
        <!-- 25 TA DARSLIK RO'YXATI -->
        <script>
            const darslar = [
                "Python-ga kirish va o'rnatish", "O'zgaruvchilar (Variables)", "Ma'lumot turlari", 
                "Sonlar (Numbers)", "Matnlar (Strings)", "Input (Ma'lumot kiritish)", 
                "List (Ro'yxatlar)", "Tuple va Set", "Dictionary (Lug'at)", 
                "If, Else, Elif", "For Loop", "While Loop", "Funksiyalar (Functions)", 
                "Lambda funksiyasi", "Klasslar (Classes)", "Inheritance (Merosxo'rlik)", 
                "Modullar", "Datetimes", "Math (Matematika)", "JSON bilan ishlash", 
                "RegEx (Muntazam ifodalar)", "PIP (Paketlar)", "Try...Except", 
                "Fayllar bilan ishlash", "Yakuniy loyiha: Bot yaratish"
            ];

            // Har bir dars uchun qator yaratish
            darslar.forEach((nomi, index) => {
                document.write(`
                    <div class="lesson-item" onclick="playVideo('${index + 1}')">
                        <span><span class="lesson-number">${index + 1}.</span> ${nomi}</span>
                        <span class="play-icon">▶️</span>
                    </div>
                `);
            });

            function playVideo(darsId) {
                const player = document.getElementById('videoPlayer');
                const frame = document.getElementById('youtubeFrame');
                
                // BU YERGA O'ZINGIZNING YOUTUBE LINKLARINGIZNI QO'YISHINGIZ MUMKIN
                // Hozircha hamma darsga bitta namuna qo'yib turaman
                player.style.display = 'block';
                frame.src = "https://youtube.com"; 
                
                // Sahifani videoga qaratib siljitish
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        </script>
    </div>
</div>

</body>
</html>
