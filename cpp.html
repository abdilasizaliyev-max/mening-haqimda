<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Video Kurs | 25 Mavzu</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #12121a; --card: #1a1a26;
            --accent: #00ff88; --accent2: #7c3aed; --accent3: #ff6b35;
            --text: #e8e8f0; --muted: #6b6b80; --border: #2a2a3a;
        }
        body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--accent); margin-bottom: 30px; }
        
        .lesson-item {
            display: flex; align-items: center; gap: 15px;
            background: var(--card); border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; margin-bottom: 10px;
            cursor: pointer; transition: 0.3s;
        }
        .lesson-item:hover { border-color: var(--accent); transform: translateX(5px); }
        .lesson-num { font-family: 'Space Mono'; color: var(--accent); font-weight: bold; }
        .lesson-info { flex: 1; }
        .lesson-title { font-weight: 600; }
        .lesson-tag { font-size: 10px; padding: 3px 8px; border-radius: 10px; background: rgba(0,255,136,0.1); color: var(--accent); }

        /* Video Modal */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .video-container { width: 90%; max-width: 800px; aspect-ratio: 16/9; position: relative; }
        iframe { width: 100%; height: 100%; border-radius: 15px; border: 2px solid var(--accent); }
        .close-btn { position: absolute; top: -40px; right: 0; color: white; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>C++ Noldan (25 Mavzu)</h1>
    
    <div id="lessons">
        <!-- 1-mavzu -->
        <div class="lesson-item" onclick="playVideo('VIDEO_ID_1')">
            <div class="lesson-num">01</div>
            <div class="lesson-info">
                <div class="lesson-title">C++ Kirish va IDE o'rnatish</div>
                <div class="lesson-tag">Basic</div>
            </div>
            <span>▶️</span>
        </div>

        <!-- 2-mavzu -->
        <div class="lesson-item" onclick="playVideo('VIDEO_ID_2')">
            <div class="lesson-num">02</div>
            <div class="lesson-info">
                <div class="lesson-title">O'zgaruvchilar va Ma'lumot turlari</div>
                <div class="lesson-tag">Basic</div>
            </div>
            <span>▶️</span>
        </div>
        
        <p style="text-align:center; color:var(--muted)">... qolgan 23 ta mavzu ham shu tartibda ...</p>
    </div>
</div>

<!-- Video Pleyer -->
<div class="modal" id="videoModal">
    <div class="video-container">
        <span class="close-btn" onclick="closeVideo()">&times; Yopish</span>
        <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<script>
    function playVideo(id) {
        const modal = document.getElementById('videoModal');
        const frame = document.getElementById('videoFrame');
        // Bu yerga haqiqiy YouTube ID sini qo'yasiz
        frame.src = "https://youtube.com" + id + "?autoplay=1";
        modal.classList.add('active');
    }

    function closeVideo() {
        const modal = document.getElementById('videoModal');
        const frame = document.getElementById('videoFrame');
        frame.src = "";
        modal.classList.remove('active');
    }
</script>

</body>
</html>
