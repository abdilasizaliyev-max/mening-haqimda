<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Master Kurs | 25 Mavzu</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #12121a; --card: #1a1a26;
            --accent: #00ff88; --text: #e8e8f0; --muted: #6b6b80; --border: #2a2a3a;
        }
        body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        
        .lesson-grid { display: flex; flex-direction: column; gap: 12px; }
        .lesson-item {
            display: flex; align-items: center; gap: 15px;
            background: var(--card); border: 1px solid var(--border);
            padding: 20px; border-radius: 16px; transition: 0.3s;
            cursor: pointer;
        }
        .lesson-item:hover { border-color: var(--accent); transform: translateX(10px); background: #1e1e2e; }
        .lesson-num { font-family: 'Space Mono'; color: var(--accent); font-weight: bold; font-size: 1.2rem; min-width: 40px; }
        .lesson-info { flex: 1; }
        .lesson-title { font-weight: 600; font-size: 1.1rem; }
        .play-btn { background: var(--accent); color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        /* VIDEO MODAL */
        #vModal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            z-index: 10000; align-items: center; justify-content: center;
        }
        #vModal.active { display: flex; }
        .video-box { width: 90%; max-width: 800px; position: relative; }
        .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 15px; overflow: hidden; border: 2px solid var(--accent); }
        .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .close-btn { position: absolute; top: -40px; right: 0; color: var(--accent); cursor: pointer; font-family: 'Space Mono'; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>C++ VIDEO DARSLAR</h1>
        <p style="color: var(--muted)">Har bir darsni ustiga bossangiz video ochiladi</p>
    </div>
    <div class="lesson-grid" id="list"></div>
</div>

<div id="vModal">
    <div class="video-box">
        <span class="close-btn" onclick="closeV()">[ X YOPISH ]</span>
        <div class="video-wrap">
            <iframe id="vFrame" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
    // Darslar ro'yxati va YouTube Video ID-lari
    const lessons = [
        { t: "C++ Kirish va IDE o'rnatish", v: "9C_6o_58K8M" },
        { t: "O'zgaruvchilar va Ma'lumot turlari", v: "bL95yD_Y9Uo" },
        { t: "Kirish va Chiqish (cin, cout)", v: "m-h6z6_m9tI" },
        { t: "Arifmetik operatorlar", v: "8_7LpY5eL0M" },
        { t: "Shartli operatorlar (if, else)", v: "K0T5iZ_Qf0A" },
        { t: "Switch-case operatori", v: "mS6mB9C496A" },
        { t: "For sikli asoslari", v: "p9WvKx_Lz4M" },
        { t: "While va Do-while", v: "XmZ9I9E_mD0" },
        { t: "Massivlar (Arrays)", v: "9YnE7G_Y9Uo" },
        { t: "Funksiyalar", v: "mS6mB9C496A" }
        // Qolgan darslar ham shu tartibda davom etadi...
    ];

    const listDiv = document.getElementById('list');
    const modal = document.getElementById('vModal');
    const iframe = document.getElementById('vFrame');

    lessons.forEach((l, i) => {
        const item = document.createElement('div');
        item.className = 'lesson-item';
        item.onclick = () => {
            iframe.src = `https://youtube.com{l.v}?autoplay=1`;
            modal.classList.add('active');
        };
        item.innerHTML = `
            <div class="lesson-num">${(i + 1).toString().padStart(2, '0')}</div>
            <div class="lesson-info"><div class="lesson-title">${l.t}</div></div>
            <button class="play-btn">VIDEO ▶</button>
        `;
        listDiv.appendChild(item);
    });

    function closeV() {
        modal.classList.remove('active');
        iframe.src = "";
    }
</script>
</body>
</html>
