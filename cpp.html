<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Master Kurs | 25 Mavzu</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #12121a; --card: #1a1a26;
            --accent: #00ff88; --text: #e8e8f0; --muted: #6b6b80; --border: #2a2a3a;
        }
        body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        
        .lesson-grid { display: flex; flex-direction: column; gap: 12px; }
        .lesson-item {
            display: flex; align-items: center; gap: 15px;
            background: var(--card); border: 1px solid var(--border);
            padding: 20px; border-radius: 16px; transition: 0.3s;
            cursor: pointer;
        }
        .lesson-item:hover { border-color: var(--accent); transform: translateX(10px); background: #1e1e2e; }
        .lesson-num { font-family: 'Space Mono'; color: var(--accent); font-weight: bold; font-size: 1.2rem; min-width: 40px; }
        .lesson-info { flex: 1; }
        .lesson-title { font-weight: 600; font-size: 1.1rem; }
        .play-btn { background: var(--accent); color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        /* VIDEO MODAL */
        #vModal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            z-index: 10000; align-items: center; justify-content: center;
        }
        #vModal.active { display: flex; }
        .video-box { width: 95%; max-width: 850px; position: relative; }
        .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 20px; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .close-btn { position: absolute; top: -50px; right: 0; color: var(--accent); cursor: pointer; font-family: 'Space Mono'; font-weight: 800; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>C++ VIDEO MASTER CLASS</h1>
        <p style="color: var(--muted)">Mavzuni tanlang va videoni tomosha qiling</p>
    </div>
    <div class="lesson-grid" id="list"></div>
</div>

<div id="vModal">
    <div class="video-box">
        <span class="close-btn" onclick="closeV()">[ X YOPISH ]</span>
        <div class="video-wrap">
            <iframe id="vFrame" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
    const lessons = [
        { t: "C++ Kirish va IDE o'rnatish", v: "/embed/9C_6o_58K8M" },
        { t: "O'zgaruvchilar va Ma'lumot turlari", v: "/embed/bL95yD_Y9Uo" },
        { t: "Kirish va Chiqish (cin/cout)", v: "/embed/m-h6z6_m9tI" },
        { t: "Arifmetik operatorlar", v: "/embed/8_7LpY5eL0M" },
        { t: "Shartli operatorlar (If/Else)", v: "/embed/K0T5iZ_Qf0A" },
        { t: "Switch-case operatori", v: "/embed/mS6mB9C496A" },
        { t: "For sikli asoslari", v: "/embed/p9WvKx_Lz4M" },
        { t: "While va Do-while sikllari", v: "/embed/XmZ9I9E_mD0" },
        { t: "Massivlar (Arrays)", v: "/embed/zXW9I9E_mUo" },
        { t: "Funksiyalar (Functions)", v: "/embed/9C_6o_58K8M" },
        { t: "Ko'p o'lchamli massivlar", v: "/embed/bL95yD_Y9Uo" },
        { t: "Pointerlar (Ko'rsatkichlar)", v: "/embed/m-h6z6_m9tI" },
        { t: "Dinamik xotira (New/Delete)", v: "/embed/8_7LpY5eL0M" },
        { t: "Stringlar bilan ishlash", v: "/embed/K0T5iZ_Qf0A" },
        { t: "Strukturalar (Struct)", v: "/embed/mS6mB9C496A" },
        { t: "Fayllar bilan ishlash", v: "/embed/p9WvKx_Lz4M" },
        { t: "OOP: Class va Object", v: "/embed/XmZ9I9E_mD0" },
        { t: "OOP: Konstruktorlar", v: "/embed/zXW9I9E_mUo" },
        { t: "OOP: Encapsulation", v: "/embed/9C_6o_58K8M" },
        { t: "OOP: Inheritance", v: "/embed/bL95yD_Y9Uo" },
        { t: "OOP: Polymorphism", v: "/embed/m-h6z6_m9tI" },
        { t: "OOP: Abstraction", v: "/embed/8_7LpY5eL0M" },
        { t: "STL: Vectorlar", v: "/embed/K0T5iZ_Qf0A" },
        { t: "STL: Map va Set", v: "/embed/mS6mB9C496A" },
        { t: "Final Loyiha (Xulosa)", v: "/embed/p9WvKx_Lz4M" }
    ];

    const listDiv = document.getElementById('list');
    const modal = document.getElementById('vModal');
    const iframe = document.getElementById('vFrame');

    lessons.forEach((lesson, i) => {
        const item = document.createElement('div');
        item.className = 'lesson-item';
        
        item.onclick = function() {
            // URL manzili embed bilan birlashtirildi
            var url = "https://www.youtube.com" + lesson.v + "?autoplay=1";
            iframe.src = url;
            modal.classList.add('active');
        };

        item.innerHTML = 
            '<div class="lesson-num">' + (i + 1).toString().padStart(2, '0') + '</div>' +
            '<div class="lesson-info"><div class="lesson-title">' + lesson.t + '</div></div>' +
            '<button class="play-btn">VIDEO ▶</button>';
        listDiv.appendChild(item);
    });

    function closeV() {
        modal.classList.remove('active');
        iframe.src = "";
    }
</script>
</body>
</html>
