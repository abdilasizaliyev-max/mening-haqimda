<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Master Kurs | 25 Mavzu</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f; --surface: #12121a; --card: #1a1a26;
            --accent: #00ff88; --accent2: #7c3aed; --accent3: #ff6b35;
            --text: #e8e8f0; --muted: #6b6b80; --border: #2a2a3a;
        }
        body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        h1 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        
        .lesson-grid { display: flex; flex-direction: column; gap: 10px; }
        .lesson-item {
            display: flex; align-items: center; gap: 15px;
            background: var(--card); border: 1px solid var(--border);
            padding: 18px; border-radius: 12px; transition: 0.3s;
        }
        .lesson-item:hover { border-color: var(--accent); transform: translateX(8px); }
        .lesson-num { font-family: 'Space Mono'; color: var(--accent); font-weight: bold; width: 30px; }
        .lesson-info { flex: 1; }
        .lesson-title { font-weight: 600; font-size: 1.05rem; }
        .links { display: flex; gap: 8px; margin-top: 5px; }
        .btn-link { 
            font-size: 10px; text-decoration: none; color: var(--muted); 
            border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px;
        }
        .btn-link:hover { color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>C++ Noldan Professionalgacha</h1>
        <p style="color: var(--muted)">25 ta asosiy mavzu va foydali manbalar</p>
    </div>

    <div class="lesson-grid" id="lessonList">
        <!-- Mavzular JavaScript orqali avtomatik generatsiya qilinadi -->
    </div>
</div>

<script>
    const lessons = [
        "C++ Kirish va IDE o'rnatish (Visual Studio, Code::Blocks)",
        "O'zgaruvchilar va Ma'lumot turlari",
        "Kirish va Chiqish operatorlari (cin, cout)",
        "Arifmetik operatorlar va Matematik funksiyalar",
        "Mantiqiy amallar va Taqqoslash",
        "Shartli operatorlar (if, else)",
        "Switch-case tanlov operatori",
        "For sikli va takrorlanishlar",
        "While va Do-while sikllari",
        "Nested loops (Ichma-ich sikllar)",
        "Bir o'lchamli massivlar (Arrays)",
        "Ko'p o'lchamli massivlar (Matrices)",
        "String (Satrlar) bilan ishlash",
        "Funksiyalar: Kirish va turlari",
        "Funksiyalarga parametr uzatish",
        "Rekursiv funksiyalar",
        "Pointerlar (Ko'rsatkichlar) asoslari",
        "Pointerlar va Massivlar bog'liqligi",
        "Dinamik xotira bilan ishlash (new, delete)",
        "Strukturalar (struct)",
        "Fayllar bilan ishlash (ifstream, ofstream)",
        "OOP: Class va Object tushunchasi",
        "OOP: Encapsulation va Constructors",
        "OOP: Inheritance (Vorislilik)",
        "STL kutubxonasi: Vector, List, Map"
    ];

    const listContainer = document.getElementById('lessonList');
    const resources = `
        <div class="links">
            <a href="https://visualstudio.microsoft.com/" class="btn-link">VS</a>
            <a href="http://www.codeblocks.org/" class="btn-link">Code::Blocks</a>
            <a href="https://www.jetbrains.com/clion/" class="btn-link">CLion</a>
        </div>`;

    lessons.forEach((title, index) => {
        const item = document.createElement('div');
        item.className = 'lesson-item';
        item.innerHTML = `
            <div class="lesson-num">${(index + 1).toString().padStart(2, '0')}</div>
            <div class="lesson-info">
                <div class="lesson-title">${title}</div>
                ${resources}
            </div>
            <div style="font-size: 1.2rem; cursor: pointer;">📘</div>
        `;
        listContainer.appendChild(item);
    });
</script>

</body>
</html>
